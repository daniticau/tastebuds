<style>
  :root {
    --paper: #F1ECE4;
    --paper-light: #FBF8F3;
    --ink: #25201B;
    --muted: #6B6358;
    --line: rgb(37 32 27 / 11%);
    --accent: #A65A3C;
    --tongue: #DB6449;
    --focus: #2B59FF;
    --serif: "Newsreader", ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --sans: ui-rounded, "SF Pro Rounded", "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #181512;
      --paper-light: #1D1A16;
      --ink: #EFE9E0;
      --muted: #ADA397;
      --line: rgb(255 255 255 / 12%);
      --accent: #D08563;
      --tongue: #E57B60;
      --focus: #8FA8FF;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  nav { max-width: 760px; margin: 0 auto; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font: 600 23px/1 var(--serif); letter-spacing: -0.03em; color: var(--ink); text-decoration: none; }
  .brand svg { width: 26px; height: 26px; color: var(--ink); }
  .links { font-size: 15px; font-weight: 500; }
  .links a { color: var(--ink); text-decoration: none; opacity: 0.82; margin-left: 18px; }
  .links a:hover { opacity: 1; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 72px; }
  h1 { font: 600 clamp(34px, 6vw, 46px)/1.05 var(--serif); letter-spacing: -0.04em; margin: 0 0 8px; }
  h2 { font: 600 27px/1.15 var(--serif); letter-spacing: -0.03em; margin: 44px 0 10px; }
  h3 { font: 600 20px/1.2 var(--serif); letter-spacing: -0.02em; margin: 26px 0 6px; }
  p, li { color: color-mix(in srgb, var(--ink) 88%, transparent); }
  p { margin: 0 0 14px; }
  ul, ol { padding-left: 22px; margin: 0 0 14px; }
  li { margin-bottom: 6px; }
  .updated { color: var(--muted); font-size: 14.5px; margin-bottom: 26px; }
  code, pre { font-family: var(--mono); font-size: 13.5px; }
  code { background: var(--paper-light); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
  pre { background: var(--paper-light); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  pre code { background: none; border: 0; padding: 0; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 0 0 14px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; color: var(--muted); }
  footer { max-width: 760px; margin: 0 auto; padding: 0 20px 48px; font-size: 14.5px; color: var(--muted); }
  footer a { color: inherit; margin-right: 16px; }
</style>
